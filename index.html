<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pong Redux" />
  <title>Pong Rebuild</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Overlay screens (ADR 0001): HTML over the canvas, shown by src/screens.js -->
    <section class="screen landing" data-screen="landing" aria-labelledby="landing-title" hidden>
      <header class="landing-head">
        <h1 class="landing-title" id="landing-title">PONG REDUX</h1>
        <button type="button" class="icon-button" data-action="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="4"/>
            <g fill="currentColor">
              <rect x="10" y="1" width="4" height="5" rx="1"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(45 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(90 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(135 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(180 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(225 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(270 12 12)"/>
              <rect x="10" y="1" width="4" height="5" rx="1" transform="rotate(315 12 12)"/>
            </g>
          </svg>
        </button>
      </header>

      <div class="modes">
        <button type="button" class="mode" data-mode="single" aria-label="vs CPU" aria-describedby="mode-single-desc">
          <span class="mode-name" aria-hidden="true">vs CPU</span>
          <span class="mode-desc" id="mode-single-desc">You against the computer.</span>
          <kbd class="mode-key" aria-hidden="true">1</kbd>
        </button>
        <button type="button" class="mode" data-mode="versus" aria-label="2 Players" aria-describedby="mode-versus-desc">
          <span class="mode-name" aria-hidden="true">2 Players</span>
          <span class="mode-desc" id="mode-versus-desc">Two players, one device.</span>
          <kbd class="mode-key" aria-hidden="true">2</kbd>
        </button>
        <button type="button" class="mode mode-rugby" data-mode="rugby-single" aria-label="Rugby (1P)" aria-describedby="mode-rugby-single-desc">
          <span class="mode-name" aria-hidden="true">Rugby (1P)</span>
          <span class="mode-desc" id="mode-rugby-single-desc">Spin, momentum and score multipliers for long rallies, against the CPU. Race to a target score or beat the clock.</span>
        </button>
        <button type="button" class="mode mode-rugby" data-mode="rugby-versus" aria-label="Rugby (2P)" aria-describedby="mode-rugby-versus-desc">
          <span class="mode-name" aria-hidden="true">Rugby (2P)</span>
          <span class="mode-desc" id="mode-rugby-versus-desc">The same, head to head.</span>
        </button>
      </div>

      <footer class="landing-foot">
        <p class="high-score" hidden></p>
        <p class="key-hint">Press <kbd>1</kbd> or <kbd>2</kbd>, or arrows and <kbd>Enter</kbd> · <kbd>Tab</kbd> for settings</p>
        <a class="credit-link standalone-only" href="https://waynetellis.com/workshop/projects">Built by Wayne Ellis · waynetellis.com</a>
      </footer>
    </section>

    <!-- HUD: the pause button, top-right (top-left belongs to the portfolio's back link, ADR 0002) -->
    <section class="screen hud" data-screen="hud" aria-label="Game controls" hidden>
      <button type="button" class="pause-button" data-action="pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
          <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
        </svg>
      </button>
    </section>

    <section class="screen overlay pause" data-screen="pause" aria-labelledby="pause-title" hidden>
      <h2 class="overlay-title" id="pause-title">PAUSED</h2>
      <div class="overlay-actions">
        <button type="button" class="overlay-button" data-action="resume">Resume</button>
        <button type="button" class="overlay-button" data-action="settings">Settings</button>
        <button type="button" class="overlay-button" data-action="quit">Quit to Menu</button>
      </div>
      <p class="key-hint"><kbd>P</kbd> or <kbd>Esc</kbd> to resume · <kbd>M</kbd> for the menu</p>
    </section>

    <section class="screen overlay victory" data-screen="victory" aria-labelledby="victory-title" hidden>
      <h2 class="overlay-title" id="victory-title" aria-live="polite"></h2>
      <div class="overlay-actions">
        <button type="button" class="overlay-button" data-action="again">Play Again</button>
        <button type="button" class="overlay-button" data-action="menu">Main Menu</button>
      </div>
      <p class="key-hint"><kbd>Space</kbd> to play again · <kbd>Esc</kbd> for the menu</p>
    </section>
  </div>
  <div id="rotate-prompt" class="rotate-prompt" role="alert" aria-live="assertive">
    <svg class="rotate-icon" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
      <rect x="22" y="6" width="20" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M12 50 a24 24 0 0 0 40 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M52 50 l-1 -9 m1 9 l-9 -1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="rotate-title">Please turn your phone</p>
    <p class="rotate-sub">Pong plays sideways.</p>
  </div>
  <script type="module">
    import { createGame } from './src/main.js';
    import { attachRotatePrompt } from './src/rotate.js';

    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
      console.error('Canvas element not found');
      throw new Error('Failed to initialize game: canvas element missing');
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) {
      console.error('Failed to get 2D context');
      throw new Error('Canvas 2D context not supported');
    }

    const game = createGame(canvas);
    attachRotatePrompt(game.getState());

    // Start the game; src/screens.js shows the HTML landing screen over the canvas
    game.start();

    // Expose state for E2E tests
    window.__game = game;
    window.__gameState = game.getState();

    // Display scaling to the viewport is handled in CSS (styles.css); the
    // internal 800x600 resolution and pointer mapping are unaffected.
  </script>
</body>
</html>
