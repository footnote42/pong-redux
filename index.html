<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pong Rebuild</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <a class="credit-link" href="https://waynetellis.com/workshop/projects">Built by Wayne Ellis · waynetellis.com</a>
  <div id="rotate-prompt" class="rotate-prompt" role="alert" aria-live="assertive">
    <svg class="rotate-icon" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
      <rect x="22" y="6" width="20" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M12 50 a24 24 0 0 0 40 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M52 50 l-1 -9 m1 9 l-9 -1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="rotate-title">Please turn your phone</p>
    <p class="rotate-sub">Pong plays sideways.</p>
  </div>
  <script type="module">
    import { createGame } from './src/main.js';
    import { attachRotatePrompt } from './src/rotate.js';

    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
      console.error('Canvas element not found');
      throw new Error('Failed to initialize game: canvas element missing');
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) {
      console.error('Failed to get 2D context');
      throw new Error('Canvas 2D context not supported');
    }

    const game = createGame(canvas);
    attachRotatePrompt(game.getState());

    // Start the game (landing screen will be shown if first time)
    game.start();

    // Expose state for E2E tests
    window.__game = game;
    window.__gameState = game.getState();

    // Display scaling to the viewport is handled in CSS (styles.css); the
    // internal 800x600 resolution and pointer mapping are unaffected.
  </script>
</body>
</html>
